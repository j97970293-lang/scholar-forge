name: ScholarForge CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    # Pin the OS: ubuntu-latest migrated to 26.04, which has no setup-python 3.9 build.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile all Python
        run: python -m compileall -q scripts tools tests
      - name: Validate JSON config data
        run: |
          python - <<'PY'
          import glob, json
          files = (glob.glob('config/*.json') + glob.glob('data/*.json')
                   + ['upstream/manifest.json', 'upstream/v2/manifest.json',
                      'evals/cases.jsonl'])
          for f in files:
              if f.endswith('.jsonl'):
                  for line in open(f, encoding='utf-8'):
                      if line.strip(): json.loads(line)
              else:
                  json.load(open(f, encoding='utf-8'))
              print('valid:', f)
          PY
      - name: Agent Skills spec validation
        run: python3 tools/validate_skill.py
      - name: Doctor
        run: python3 scripts/scholarforge.py doctor
      - name: Unit tests
        run: python3 scripts/scholarforge.py selftest
      - name: New 1.1 commands (offline smoke test)
        run: |
          python3 scripts/scholarforge.py guideline --list | head -8
          python3 scripts/scholarforge.py guideline --recommend "diagnostic accuracy of an AI test"
          python3 scripts/scholarforge.py integrity templates/references.bib
          python3 scripts/scholarforge.py validate --json > /tmp/sf-validation.json
          python3 -c "import json; assert json.load(open('/tmp/sf-validation.json'))['ok']"
          python3 scripts/scholarforge.py disclosure --tool "Example tool" --tool-version "1.0" --purpose editing --authors "Demo author" --oversight "Human review" --verification "All edits compared" --prompts "Appendix B" --policy-date "2026-10-28" --out /tmp/sf-disclosure.md
          python3 scripts/scholarforge.py disclosure --check /tmp/sf-disclosure.md
          if python3 scripts/scholarforge.py disclosure --check templates/ai-disclosure.md; then
            echo "Blank disclosure template must fail" >&2; exit 1
          fi
      - name: End-to-end demo (expected FAIL)
        run: bash examples/end-to-end/run-demo.sh | tail -25
      - name: End-to-end demo (clean variant)
        run: "bash examples/end-to-end/run-demo.sh --fixed | grep -E 'Verdict: PASS|Ran [0-9]+ tests'"
      - name: Secret scan
        run: python3 tools/check_secrets.py
